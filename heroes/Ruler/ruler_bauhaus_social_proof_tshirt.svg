<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">The everyday standard — Common Ground tee</title>
  <desc id="desc">A Bauhaus-inspired landing page hero for a practical everyday T-shirt, with confident navy typography, a geometric product illustration, and a diverse group of neighbors wearing the tee as social proof.</desc>
