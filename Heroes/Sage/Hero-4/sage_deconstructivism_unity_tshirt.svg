<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Think in company — The Common Thread philosophy T-shirt</title>
  <desc id="desc">A deconstructivist advertising hero for a philosopher T-shirt, showing offset architectural forms, fragmented shirt panels, and several distinct voices oriented toward a shared question.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#342C44" stroke-width="1" opacity=".13"/></pattern>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="15" stdDeviation="13" flood-color="#342C44" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1440" height="900" fill="#F1EEE8"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <!-- Offset planes: architectural instability around a calm copy zone -->
  <path d="M879 0h561v900h-206L821 318z" fill="#CE5A58"/>
  <path d="M1052 0h388v900h-127L935 292z" fill="#CBB75A"/>
  <path d="M1239 0h201v900h-137L1038 289z" fill="#77A99A"/>
  <path d="M0 687 748 433l144 467H0z" fill="#CBB75A"/>
  <path d="M0 781 563 590l94 310H0z" fill="#77A99A"/>
  <path d="M54 202 392 0h222L54 346z" fill="#CE5A58" opacity=".96"/>
  <path d="M772 0l104 0-221 402-73-45z" fill="#342C44"/>
  <path d="M0 0h1440v16H0z" fill="#342C44"/>
  <!-- restrained masthead -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#342C44">
    <text x="80" y="67" font-size="18" font-weight="800" letter-spacing="3.5">COMMON THREAD</text>
    <path d="M80 83h145" stroke="#342C44" stroke-width="2"/>
    <text x="1360" y="67" text-anchor="end" font-size="12" font-weight="700" letter-spacing="2">OBJECTS FOR OPEN MINDS / 01</text>
  </g>
  <!-- clean editorial field, deliberately offset from fractured product image -->
  <path d="M77 188h630v474H77z" fill="#F1EEE8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#342C44">
    <text x="91" y="265" font-size="15" font-weight="800" letter-spacing="3">FOR PHILOSOPHERS &amp; QUESTIONERS</text>
    <text x="83" y="371" font-size="83" font-weight="900" letter-spacing="-4">THINK</text>
    <text x="83" y="462" font-size="83" font-weight="900" letter-spacing="-4">IN</text>
    <text x="83" y="553" font-size="83" font-weight="900" letter-spacing="-4">COMPANY.</text>
    <path d="M87 580h90" stroke="#CE5A58" stroke-width="9"/>
    <text x="91" y="624" font-size="19" font-weight="500">One question can open many minds.</text>
    <text x="91" y="652" font-size="19" font-weight="500">Wear the reminder. Bring the conversation.</text>
  </g>
  <!-- distinct, overlapping slabs compose the tee; offset seams evoke shifted volumes -->
  <g filter="url(#lift)">
    <path d="M943 263l102-62 101 32 98-53 102 78-60 116-60-31v287H923V341l-59 39-64-102 116-72z" fill="#F8F6F0" stroke="#342C44" stroke-width="7" stroke-linejoin="round"/>
    <path d="M943 263l102-62 30 116-95 67-65-85z" fill="#CE5A58" stroke="#342C44" stroke-width="6" stroke-linejoin="round"/>
    <path d="M1045 201l101 32-21 103-100-19 50-49z" fill="#CBB75A" stroke="#342C44" stroke-width="6" stroke-linejoin="round"/>
    <path d="M1146 233l98-53 102 78-60 116-82-61 21-77-58 61z" fill="#77A99A" stroke="#342C44" stroke-width="6" stroke-linejoin="round"/>
    <path d="M923 341l-59 39-64-102 54-35 87 90zM1226 343l60 31 60-116 47 37-60 116-47-21v287h-60z" fill="#E6E0D9" stroke="#342C44" stroke-width="6" stroke-linejoin="round"/>
    <path d="M923 341v289h105V376zM1028 376l97-41v295h-97zM1125 335l101 8v287h-101z" fill="#F8F6F0" stroke="#342C44" stroke-width="5" stroke-linejoin="round"/>
    <path d="M1006 365l56 18-31 246h-78z" fill="#CE5A58" opacity=".95"/>
    <path d="M1122 345l67 2 36 282h-103z" fill="#CBB75A" opacity=".92"/>
    <!-- shared question crosses the different shirt planes -->
    <circle cx="1103" cy="442" r="56" fill="#342C44" stroke="#F8F6F0" stroke-width="5"/>
    <text x="1103" y="462" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#F8F6F0">?</text>
    <text x="1103" y="534" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#342C44">ASK / LISTEN / REVISE</text>
  </g>
  <!-- different speakers converge on a shared point, as fragments rather than a uniform club -->
  <g fill="#F1EEE8" stroke="#342C44" stroke-width="4" stroke-linejoin="round">
    <path d="M1016 150c-11-17-1-36 16-36 14 0 20 12 16 23-3 8-10 10-11 17l-17 3z"/>
    <path d="M1129 130c-7-18 6-34 22-31 14 2 18 15 12 25-4 7-12 8-14 16l-16-1z"/>
    <path d="M1248 155c2-19 20-30 34-21 12 7 11 21 3 28-6 5-14 4-19 11l-15-7z"/>
  </g>
  <g fill="none" stroke="#342C44" stroke-width="3" stroke-dasharray="7 8">
    <path d="M1043 157l51 51M1152 143l-25 55M1266 166l-53 42"/>
  </g>
  <circle cx="1104" cy="211" r="10" fill="#CE5A58" stroke="#342C44" stroke-width="3"/>
  <!-- CTA sits on a stable plane; diagonal routes the gaze toward it -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="91" y="728" font-size="13" font-weight="800" letter-spacing="2.5" fill="#342C44">THE INQUIRY TEE / A WEARABLE CONVERSATION STARTER</text>
    <rect x="87" y="756" width="275" height="75" fill="#342C44"/>
    <path d="M87 756h275v75H87z" fill="none" stroke="#CE5A58" stroke-width="5"/>
    <text x="113" y="803" font-size="18" font-weight="900" letter-spacing="1.2" fill="#F8F6F0">EXPLORE THE TEE</text>
    <path d="M326 784h17m-8-8 8 8-8 8" fill="none" stroke="#F8F6F0" stroke-width="3"/>
    <text x="392" y="802" font-size="14" font-weight="700" letter-spacing="1" fill="#342C44">THOUGHT IS BETTER SHARED.</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#F1EEE8">
    <text x="1365" y="822" text-anchor="end" font-size="12" font-weight="800" letter-spacing="2">OPEN QUESTIONS</text>
    <text x="1365" y="844" text-anchor="end" font-size="12" font-weight="800" letter-spacing="2">SHARED GROUND</text>
  </g>
</svg>
