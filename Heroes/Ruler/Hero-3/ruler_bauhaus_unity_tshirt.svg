    <text x="76" y="335" font-size="72">WE SET THE</text>
    <text x="76" y="417" font-size="72">STANDARD.</text>
  </g>
  <rect x="79" y="448" width="16" height="16" fill="#E05C36"/>
  <rect x="102" y="448" width="16" height="16" fill="#D2BD73"/>
  <rect x="125" y="448" width="16" height="16" fill="#648C72"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#34465A">
    <text x="77" y="511" font-size="20">An easy everyday tee for the people who make</text>
    <text x="77" y="541" font-size="20">a neighborhood feel like home.</text>
  </g>
  <text x="78" y="604" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="2.1" fill="#3A2948">THE COMMON GROUND TEE</text>
  <text x="78" y="630" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing=".5" fill="#586675">Good company. Everyday comfort.</text>
