  <g font-family="Arial, Helvetica, sans-serif" fill="#34465A">
    <text x="72" y="404" font-size="20">A dependable, easy-wearing tee for the</text><text x="72" y="434" font-size="20">days that make up a life.</text>
  </g>
  <text x="72" y="494" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#18324A">COMMON GROUND EVERYDAY TEE</text>
  <text x="72" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#586675">Comfort first. Quality that holds its shape.</text>
  <rect x="72" y="558" width="242" height="64" rx="2" fill="#C84B35"/><text x="96" y="598" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="1" fill="#FFFCF5">SHOP THE EVERYDAY TEE</text><path d="M278 590h20m-7-7 7 7-7 7" fill="none" stroke="#FFFCF5" stroke-width="2"/>
  <text x="72" y="671" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#586675">SEE THE FIT ON PEOPLE LIKE YOU</text>
