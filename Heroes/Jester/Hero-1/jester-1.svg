    <text x="305" y="882">TEES.</text>
  </g>
  <text x="978" y="859" fill="#fffdf7" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="600">Proposed one-time concept run. No actual inventory, release date, or availability is being claimed.</text>
