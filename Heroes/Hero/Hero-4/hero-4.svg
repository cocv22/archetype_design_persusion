  <text x="80" y="477" fill="#171717" font-family="Bowlby One SC, Impact, Haettenschweiler, sans-serif" font-size="89.6" paint-order="stroke" stroke="#171717" stroke-width="3">TOGETHER.</text>
  <text x="80" y="474" fill="#f15b83" font-family="Bowlby One SC, Impact, Haettenschweiler, sans-serif" font-size="89.6">TOGETHER.</text>

