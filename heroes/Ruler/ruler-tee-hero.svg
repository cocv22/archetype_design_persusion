<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">COMMON FORM — The Everyday Tee</title>
  <desc id="desc">A Swiss International Style campaign for a dependable everyday T-shirt, featuring an inclusive community portrait, clear product offer, and direct call to action.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d9ddd9" stroke-width="1"/></pattern>
    <clipPath id="photoClip"><rect x="875" y="152" width="610" height="596"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="#f5f4ef"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#grid)" opacity=".34"/>
  <rect x="0" y="0" width="1600" height="12" fill="#d8342a"/>
  <!-- Swiss grid-aligned header -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="116" y="72" font-size="25" font-weight="800" letter-spacing="2.3" fill="#171a19">COMMON FORM</text>
    <rect x="116" y="88" width="32" height="5" fill="#d8342a"/>
    <text x="876" y="70" font-size="12" letter-spacing="2" fill="#555c58">BUILT FOR EVERY DAY</text>
    <text x="1256" y="70" font-size="12" letter-spacing="1.4" fill="#171a19">ABOUT</text>
    <text x="1352" y="70" font-size="12" letter-spacing="1.4" fill="#171a19">OUR STANDARD</text>
    <path d="M116 112H1484" stroke="#171a19" stroke-width="1.5"/>
  </g>
  <!-- Copy column -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#171a19">
    <text x="116" y="178" font-size="12" font-weight="700" letter-spacing="2.2" fill="#d8342a">THE EVERYDAY TEE / 01</text>
    <text x="110" y="296" font-size="104" font-weight="800" letter-spacing="-5">GOOD</text>
    <text x="110" y="397" font-size="104" font-weight="800" letter-spacing="-5">FORM.</text>
    <text x="116" y="443" font-size="20" font-weight="700" letter-spacing=".2">A better basic. Made for all of us.</text>
    <text x="116" y="482" font-size="16" fill="#4e5551">Soft, sturdy cotton. A fit that feels like yours.</text>
    <text x="116" y="507" font-size="16" fill="#4e5551">Straightforward quality, at a fair everyday price.</text>
    <rect x="116" y="550" width="256" height="62" fill="#d8342a"/>
    <text x="144" y="589" font-size="14" font-weight="700" letter-spacing="1.3" fill="#fff">MEET YOUR NEW TEE</text>
    <path d="M342 581h14m-6-6 6 6-6 6" fill="none" stroke="#fff" stroke-width="1.8"/>
    <text x="116" y="649" font-size="12" letter-spacing="1.3" fill="#555c58">100% COTTON  ·  SIZES XS–XXL  ·  $24</text>
  </g>
  <!-- Product campaign image, geometric editorial collage -->
  <rect x="875" y="152" width="610" height="596" fill="#deded7"/>
  <g clip-path="url(#photoClip)">
    <rect x="875" y="152" width="610" height="596" fill="#dfe3dc"/>
    <rect x="875" y="152" width="207" height="596" fill="#e9b34f"/>
    <path d="M1062 152H1485V748H1062Z" fill="#a7b6a9"/>
    <circle cx="1388" cy="240" r="136" fill="#f4d787"/>
    <path d="M875 635 1143 470l181 121 161-110v267H875Z" fill="#677c70"/>
    <!-- friendly diverse trio as bold, clean shapes -->
    <!-- left person -->
    <path d="M926 740c4-99 18-178 66-199 19-9 53-12 75-2 46 22 55 111 59 201Z" fill="#d8342a"/>
    <path d="M971 545c3-44 22-78 60-78 40 0 61 33 62 80-18 23-39 34-62 34-25 0-45-13-60-36Z" fill="#8b5438"/>
    <path d="M972 515c0-48 28-74 63-74 44 0 64 31 59 72-14-20-28-28-48-28-23 0-41 16-74 30Z" fill="#272a28"/>
    <path d="M1011 572h44v31c-11 18-34 18-44 0Z" fill="#8b5438"/>
    <!-- center person -->
    <path d="M1098 752c5-124 17-204 66-229 22-11 76-11 98 1 48 25 62 111 67 228Z" fill="#f5f4ef"/>
    <path d="M1154 505c1-53 25-88 70-88 46 0 70 38 69 89-14 25-38 41-69 41-29 0-55-15-70-42Z" fill="#c7835c"/>
    <path d="M1154 482c6-55 33-84 72-84 47 0 71 30 68 78-17-19-33-26-57-25-30 1-53 20-83 31Z" fill="#332823"/>
    <path d="M1196 539h52v31c-12 17-39 17-52 0Z" fill="#c7835c"/>
    <!-- right person -->
    <path d="M1302 752c5-112 15-192 60-215 23-12 71-11 94 1 43 23 55 104 61 214Z" fill="#294b48"/>
    <path d="M1352 527c0-48 21-79 60-79 39 0 61 31 61 80-14 23-35 36-61 36-25 0-47-14-60-37Z" fill="#563a2e"/>
    <path d="M1354 496c3-49 24-74 59-74 41 0 63 27 61 70-14-16-30-24-49-24-23 0-43 14-71 28Z" fill="#191c1b"/>
    <path d="M1387 557h51v31c-12 18-39 18-51 0Z" fill="#563a2e"/>
    <!-- subtle shirt chest marks -->
    <rect x="1207" y="633" width="28" height="4" fill="#d8342a"/>
  </g>
  <!-- image label and frame -->
  <rect x="875" y="152" width="610" height="596" fill="none" stroke="#171a19" stroke-width="1.5"/>
  <rect x="900" y="175" width="196" height="34" fill="#f5f4ef"/>
  <text x="916" y="197" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#171a19">ONE TEE. EVERYBODY.</text>
  <text x="875" y="782" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.7" fill="#555c58">GOOD CLOTHES. GOOD COMPANY.</text>
  <text x="1450" y="782" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.7" fill="#555c58">01 — 03</text>
  <path d="M116 817H1484" stroke="#171a19" stroke-width="1.5"/>
  <text x="116" y="850" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.6" fill="#555c58">COMMON FORM / MADE FOR THE MANY</text>
  <text x="1484" y="850" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.6" fill="#555c58">WEAR IT WELL.</text>
</svg>
