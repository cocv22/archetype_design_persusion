    <path d="M407 58a224 224 0 0 1 214 158" fill="none" stroke="#171918" stroke-width="2"/>
    <path d="m608 198 15 21-25 8" fill="#171918"/>
    <circle cx="408" cy="282" r="188" fill="none" stroke="#f4f1e8" stroke-opacity=".55" stroke-width="2" stroke-dasharray="2 12"/>
    <path d="M107 505h552" fill="none" stroke="#171918" stroke-width="2"/>
    <path d="M145 493v24M210 493v13M275 493v24M340 493v13M405 493v24M470 493v13M535 493v24M600 493v13" stroke="#171918" stroke-width="2"/>

    <g transform="rotate(-4 405 300)">
      <path d="M291 111 215 126l-100 68 56 83 54-29v211q0 20 20 20h326q20 0 20-20V248l54 29 56-83-100-68-76-15c-13 43-41 65-84 65s-71-22-84-65z" fill="#ffffff" stroke="#171918" stroke-width="9" stroke-linejoin="round"/>
      <path d="M291 111c13 43 41 65 84 65s71-22 84-65" fill="none" stroke="#171918" stroke-width="8"/>
      <path d="M302 117c11 29 35 44 73 44s62-15 73-44" fill="none" stroke="#d6d6d6" stroke-width="4"/>
      <path d="M225 251v192q0 12 12 12h298q12 0 12-12V251M178 273l48-25M594 273l-48-25" fill="none" stroke="#d6d6d6" stroke-width="3"/>
      <path d="M229 450h312" fill="none" stroke="#d6d6d6" stroke-width="3" stroke-dasharray="3 9"/>
    </g>

    <path d="m171 169-24-24m48 3-13-34m41 20-3-35" stroke="#f2ca43" stroke-width="9" stroke-linecap="square"/>
    <path d="M590 348h53m-43 18h43m-32 18h32" stroke="#f4f1e8" stroke-width="5" stroke-linecap="square"/>
    <rect x="85" y="90" width="56" height="56" fill="#f2ca43"/>
    <path d="M85 118h56M113 90v56" stroke="#171918" stroke-width="2"/>
    <text x="92" y="552" fill="#171918" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="17" font-weight="700" letter-spacing="2">ASCEND / EDITION 01</text>
    <text x="630" y="552" fill="#171918" text-anchor="end" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="17" font-weight="700" letter-spacing="2">MAKE IT YOURS</text>
  </g>

  <g>
    <rect x="0" y="900" width="1600" height="170" fill="#f2ca43"/>
    <text x="100" y="980" fill="#171918" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="37" font-weight="800">A FIRST EDITION.</text>
    <text x="100" y="1016" fill="#171918" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="37" font-weight="800">COUNTED CLEARLY.</text>
    <text x="990" y="976" fill="#171918" font-family="'DM Sans','Helvetica Neue',sans-serif" font-size="14">This is fictional campaign messaging. Set a genuine production cap</text>
    <text x="990" y="999" fill="#171918" font-family="'DM Sans','Helvetica Neue',sans-serif" font-size="14">before release and show accurate size-by-size availability at</text>
    <text x="990" y="1022" fill="#171918" font-family="'DM Sans','Helvetica Neue',sans-serif" font-size="14">checkout; no artificial countdowns or unverified stock claims.</text>
  </g>

  <g fill="#171918" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="14" font-weight="600" letter-spacing=".7">
