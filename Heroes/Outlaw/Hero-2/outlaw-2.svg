  <rect y="1312" width="1600" height="3" fill="#17191d" />
  <text x="128" y="1388" fill="#17191d" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="28">ASCEND. THE BLANK CANVAS.</text>
  <text x="128" y="1422" fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="12">A premium plain white shirt, ready for your style and your own rules.</text>

