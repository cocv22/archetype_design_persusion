<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Ideas are better in the making — The Common Ground Tee</title>
  <desc id="desc">Constructivist advertising hero for people who enjoy sharing ideas. Three distinct voices converge on a question mark printed on a shirt, around a message of making room for one another's ideas.</desc>
  <defs>
    <pattern id="halftone" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.5" fill="#28233B" opacity=".42"/></pattern>
    <filter id="lift" x="-25%" y="-20%" width="150%" height="155%"><feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#28233B" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1440" height="900" fill="#F3EEE4"/>
  <!-- A single rising diagonal drives the eye from headline to shared prompt -->
  <path d="M0 0h1440v103L0 429z" fill="#6251A2"/>
  <path d="M0 0h26v900H0z" fill="#28233B"/>
  <path d="M1087 0h353v900h-166z" fill="#61A99F"/>
  <path d="M1192 0h248v900h-67z" fill="#E9B94D"/>
  <path d="M0 735 870 432l117 468H0z" fill="#61A99F"/>
  <path d="M0 806 748 548l86 352H0z" fill="#E9B94D"/>
  <path d="M83 89h614L83 292z" fill="url(#halftone)" opacity=".56"/>
  <path d="M1118 548l322-108v344l-237 82z" fill="#6251A2"/>
  <!-- Header -->
  <g fill="#F3EEE4" font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="68" font-size="20" font-weight="900" letter-spacing="4">COMMON THREAD</text>
    <text x="1357" y="67" text-anchor="end" font-size="12" font-weight="800" letter-spacing="2.5">IDEAS IN GOOD COMPANY  /  01</text>
  </g>
  <!-- Type is the graphic: concise, geometric, and built for a poster scale -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#28233B" font-weight="900" letter-spacing="-4">
    <text x="91" y="352" font-size="81">IDEAS</text>
    <text x="91" y="444" font-size="81">GROW</text>
    <text x="91" y="536" font-size="81">TOGETHER.</text>
  </g>
  <path d="M95 564h148" stroke="#6251A2" stroke-width="11"/>
  <g fill="#28233B" font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="611" font-size="19" font-weight="600">For people who like to make, wonder, and share.</text>
    <text x="96" y="641" font-size="19" font-weight="600">An everyday tee with room for every point of view.</text>
  </g>
  <text x="97" y="706" fill="#28233B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900" letter-spacing="2.2">THE COMMON GROUND TEE  /  A CONVERSATION STARTER</text>
  <rect x="94" y="741" width="293" height="72" fill="#6251A2" stroke="#28233B" stroke-width="4"/>
  <text x="119" y="786" fill="#FFF9EF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" letter-spacing="1.1">EXPLORE THE TEE</text>
  <path d="M344 777h20m-8-8 8 8-8 8" fill="none" stroke="#FFF9EF" stroke-width="3"/>
  <text x="414" y="783" fill="#28233B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900" letter-spacing="1.6">THINK / MAKE / SHARE</text>
  <!-- Shirt as a crafted, screen-print-like focal point -->
  <g filter="url(#lift)" stroke="#28233B" stroke-linejoin="round">
    <path d="m818 245 78-44 76 31 79-31 87 52-47 111-48-24v352H831V340l-49 25-49-105 85-42z" fill="#FFF9EF" stroke-width="8"/>
    <path d="m896 201 76 31-31 75-77-60zM972 232l79-31 39 45-81 61z" fill="#DED9EB" stroke-width="6"/>
    <path d="m782 365-48-105 49-23 49 91zM1143 363l44-94 50 27-47 91z" fill="#6251A2" stroke-width="7"/>
    <path d="M831 340l-49 25m361-25 53 28" fill="none" stroke-width="5"/>
    <path d="M867 379h216v178H867z" fill="#E9B94D" stroke-width="5"/>
    <path d="M885 397h180v143H885z" fill="none" stroke="#61A99F" stroke-width="4"/>
    <text x="975" y="487" text-anchor="middle" fill="#28233B" stroke="none" font-family="Georgia, serif" font-size="87" font-weight="700">?</text>
    <text x="975" y="521" text-anchor="middle" fill="#28233B" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="900" letter-spacing="2">MADE FOR MANY MINDS</text>
    <path d="M897 570h156" stroke="#6251A2" stroke-width="7"/>
    <text x="975" y="603" text-anchor="middle" fill="#28233B" stroke="none" font-family="Georgia, serif" font-size="17" font-style="italic">The Common Ground Tee</text>
  </g>
  <!-- Three distinct voices meet at one open question: shared participation, not gatekeeping -->
  <g stroke="#28233B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M826 183c-8-15 1-29 15-29 12 0 17 10 13 20-3 7-9 9-10 16l-13-4z" fill="#F3EEE4"/><path d="m821 189-11 9 14 3m2-9 11 4" fill="none"/>
    <path d="M1095 165c2-16 17-24 29-17 10 7 9 18 2 25-5 5-11 4-16 9l-12-8z" fill="#F3EEE4"/><path d="m1093 171-12 5 9 10m9-11 11 3" fill="none"/>
    <path d="M964 135c-8-14 1-28 15-28 11 0 16 10 12 19-3 7-9 9-11 16l-13-4z" fill="#F3EEE4"/><path d="m960 141-12 8 14 4m2-10 10 4" fill="none"/>
  </g>
  <path d="m844 186 62 42m208-59-55 57m-79-86v85" fill="none" stroke="#28233B" stroke-width="3" stroke-dasharray="5 8"/>
  <circle cx="979" cy="225" r="11" fill="#E9B94D" stroke="#28233B" stroke-width="3"/>
  <text x="1370" y="824" text-anchor="end" fill="#FFF9EF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900" letter-spacing="1.7">ONE OPEN QUESTION</text>
  <text x="1370" y="847" text-anchor="end" fill="#FFF9EF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900" letter-spacing="1.7">ROOM FOR EVERY VOICE</text>
  <path d="M1241 613l33 33-33 33" fill="none" stroke="#FFF9EF" stroke-width="5"/>
</svg>
