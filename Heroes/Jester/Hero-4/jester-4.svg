  <g transform="translate(96 173)">
    <rect x="0" y="-3" width="165" height="33" fill="#1c1b20" transform="rotate(-2 82 13)" />
    <rect x="0" y="-3" width="165" height="33" fill="#f3ce48" stroke="#1c1b20" stroke-width="2" transform="rotate(-2 82 13)" />
    <text x="10" y="18" fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing=".9">A LITTLE LESS ORDINARY</text>
    <text x="0" y="128" fill="#1c1b20" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="112" font-weight="700">PLAIN TEE.</text>
    <text x="0" y="222" fill="#e94d56" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="112" font-weight="700">PLOT TWIST.</text>
    <g fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="15" font-weight="600">
      <text x="0" y="252">ASCEND's premium plain white shirt is ready for good puns,</text>
      <text x="0" y="276">questionable dance moves, and plans that acquire a plot.</text>
      <text x="0" y="300">Blank canvas. No notes.</text>
    </g>
    <rect x="5" y="348" width="239" height="52" fill="#365fd2" />
    <rect x="0" y="343" width="239" height="52" fill="#17191d" stroke="#17191d" stroke-width="2" />
    <text x="17" y="375" fill="#fffdf7" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="800">CHOOSE TODAY'S TINY JOY</text>
    <text x="217" y="375" text-anchor="middle" fill="#fffdf7" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="25" font-weight="600">&#8594;</text>
  </g>

  <text x="1521" y="803" text-anchor="end" fill="#17191d" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="19" font-weight="600" transform="rotate(-4 1521 803)">More you. Less “what do I wear?”</text>

  <rect y="900" width="1600" height="479" fill="#365fd2" />
  <rect y="900" width="1600" height="3" fill="#17191d" />
  <text x="128" y="991" fill="#fffdf7" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1">A TINY PROMISE TO YOURSELF</text>
  <g fill="#fffdf7" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="66" font-weight="600">
    <text x="128" y="1053">Pick one bit.</text>
    <text x="128" y="1115">Make today</text>
    <text x="128" y="1178">yours.</text>
  </g>
  <g fill="#fffdf7" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="500">
    <text x="128" y="1221">A small, specific choice can be a nice nudge</text>
    <text x="128" y="1243">toward the day you want. Keep it light, change it</text>
    <text x="128" y="1265">whenever, and don't worry—we're not keeping</text>
    <text x="128" y="1287">score.</text>
  </g>

  <text x="732" y="998" fill="#fffdf7" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="23" font-weight="600">Today, I'll...</text>

  <g font-family="DM Sans, Arial, sans-serif" font-size="13" font-weight="700">
    <rect x="732" y="1016" width="740" height="54" fill="#fffdf7" stroke="#17191d" stroke-width="2" />
    <circle cx="758" cy="1043" r="9" fill="#fffdf7" stroke="#17191d" stroke-width="2" />
    <text x="777" y="1048" fill="#17191d">Tell one spectacularly bad pun.</text>

    <rect x="732" y="1078" width="740" height="54" fill="#fffdf7" stroke="#17191d" stroke-width="2" />
    <circle cx="758" cy="1105" r="9" fill="#fffdf7" stroke="#17191d" stroke-width="2" />
    <text x="777" y="1110" fill="#17191d">Make one boring thing a tiny adventure.</text>

    <rect x="732" y="1140" width="740" height="54" fill="#fffdf7" stroke="#17191d" stroke-width="2" />
    <circle cx="758" cy="1167" r="9" fill="#fffdf7" stroke="#17191d" stroke-width="2" />
    <text x="777" y="1172" fill="#17191d">Wear what feels like me, not “the occasion.”</text>
  </g>

  <rect x="732" y="1208" width="162" height="46" fill="#9f6595" stroke="#17191d" stroke-width="2" />
  <text x="813" y="1236" text-anchor="middle" fill="#fffdf7" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="800">Make it my tiny promise</text>
  <rect x="904" y="1208" width="120" height="46" fill="none" stroke="#17191d" stroke-width="2" />
  <text x="964" y="1236" text-anchor="middle" fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="800">Clear my choice</text>

  <text x="732" y="1284" fill="#fffdf7" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="600">Not in a pledge mood?</text>
  <text x="864" y="1284" fill="#fffdf7" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="800" text-decoration="underline">Skip it and meet the plain tee.</text>
  <text x="732" y="1310" fill="#fffdf7" opacity=".9" font-family="DM Sans, Arial, sans-serif" font-size="10">Your choice stays on this page only. Edit or clear it anytime; nothing is saved or sent.</text>

  <rect y="1379" width="1600" height="180" fill="#f3ce48" />
  <rect y="1379" width="1600" height="3" fill="#17191d" />
  <text x="128" y="1450" fill="#17191d" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="28" font-weight="600">ASCEND: your blank-canvas pal.</text>
  <text x="128" y="1482" fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="13">A premium plain white shirt, ready for your style and whatever little adventure shows up next.</text>

  <rect x="1308" y="1449" width="169" height="52" fill="#365fd2" />
  <rect x="1303" y="1444" width="169" height="52" fill="#17191d" stroke="#17191d" stroke-width="2" />
  <text x="1317" y="1475" fill="#fffdf7" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="800">BACK TO THE BIT</text>
  <text x="1452" y="1475" text-anchor="middle" fill="#fffdf7" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="25" font-weight="600">&#8593;</text>
