<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1559" viewBox="0 0 1600 1559" role="img" aria-labelledby="title description">
  <title id="title">ASCEND: Plain Tee. Plot Twist. — complete Jester advertisement</title>
  <desc id="description">The complete ASCEND Jester advertisement: a full-bleed expressive illustration of a joyful character wearing a blank white shirt, followed by an optional tiny-promise form and yellow ASCEND product section.</desc>
  <defs>
    <pattern id="dry-brush" width="29" height="25" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)">
      <path d="M0 4h19M8 12h21M1 21h14" stroke="#17191d" stroke-width="2" opacity=".23" />
    </pattern>
    <pattern id="flecks" width="36" height="33" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="9" r="3" fill="#17191d" opacity=".46" />
      <path d="m24 23 7-5" stroke="#17191d" stroke-width="2" opacity=".45" />
    </pattern>
  </defs>

  <rect width="1600" height="1559" fill="#f4efdf" />
  <rect width="1600" height="74" fill="#fffdf7" />
