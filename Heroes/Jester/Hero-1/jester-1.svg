        <circle cx="649" cy="130" r="57" fill="#f4cb38" />
        <circle cx="631" cy="122" r="5" fill="#17191d" />
        <circle cx="666" cy="122" r="5" fill="#17191d" />
        <path d="M631 144q18 22 36 0" fill="none" />
        <path d="M588 80 566 62m100-9 7-23m42 68 23-6" fill="none" stroke="#e64232" stroke-width="8" />
      </g>

      <g fill="#17191d" font-family="Arial, sans-serif" font-weight="800">
        <text x="55" y="253" font-size="15" letter-spacing="2">THE EVERYDAY</text>
        <text x="55" y="278" font-size="15" letter-spacing="2">PLOT TWIST</text>
        <text x="601" y="220" font-size="15" letter-spacing="2" transform="rotate(90 601 220)">SERIOUSLY SOFT</text>
        <text x="502" y="563" font-size="14" letter-spacing="2" fill="#fffdf7">ASCEND / 01</text>
      </g>
      <path d="M36 550h74v4H36zm98 0h25v4h-25z" fill="#17191d" />
