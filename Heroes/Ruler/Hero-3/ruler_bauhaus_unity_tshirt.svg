<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Together, we set the standard — Common Ground everyday tee</title>
  <desc id="desc">A Bauhaus-inspired advertising hero for an everyday T-shirt. A bold geometric shirt graphic sits alongside a diverse group of neighbors gathered around a shared table, with an invitation to find their common ground.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#3A2948" flood-opacity=".16"/></filter>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#3A2948" opacity=".22"/></pattern>
  </defs>
