<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Start with an idea — The First Mark T-shirt</title>
  <desc id="desc">A constructivist advertising hero for people with ideas. A graphic question mark T-shirt sits beside a voluntary choose-your-word prompt, inviting people to name a creative intention before exploring the shirt.</desc>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#202B35" opacity=".4"/></pattern>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="155%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#202B35" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1440" height="900" fill="#F4F0E7"/>
  <!-- Constructed diagonals drive the eye from promise to product -->
  <path d="M0 0h1440v105L0 418z" fill="#D94732"/>
  <path d="M0 0h25v900H0z" fill="#202B35"/>
  <path d="M1094 0h346v900h-146z" fill="#E5AC3D"/>
  <path d="M1196 0h244v900h-67z" fill="#287C78"/>
  <path d="M0 727 875 433l119 467H0z" fill="#E5AC3D"/>
  <path d="M0 797 748 544l86 356H0z" fill="#287C78"/>
  <path d="M82 90h590L82 285z" fill="url(#dots)" opacity=".46"/>
  <path d="M1115 550l325-105v344l-246 82z" fill="#D94732"/>
  <!-- Brand navigation -->
  <g fill="#F4F0E7" font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="68" font-size="20" font-weight="900" letter-spacing="4">COMMON THREAD</text>
    <text x="1358" y="67" text-anchor="end" font-size="12" font-weight="800" letter-spacing="2.5">IDEAS IN THE MAKING  /  01</text>
  </g>
  <!-- Headline -->
  <g fill="#202B35" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" letter-spacing="-4">
    <text x="91" y="352">START</text><text x="91" y="443">WITH AN</text><text x="91" y="534">IDEA.</text>
  </g>
  <path d="M94 563h138" stroke="#D94732" stroke-width="11"/>
  <g fill="#202B35" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">
    <text x="95" y="610">For the thing you keep thinking about.</text>
    <text x="95" y="639">A soft everyday tee, printed with room for more.</text>
  </g>
  <!-- Small chosen commitment: explicit, optional, revisable -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="692" fill="#202B35" font-size="12" font-weight="900" letter-spacing="2.2">YOUR FIRST MARK  /  OPTIONAL</text>
    <rect x="94" y="711" width="446" height="112" fill="#FBF8F0" stroke="#202B35" stroke-width="3"/>
    <path d="M94 711h446v11H94z" fill="#D94732"/>
    <text x="113" y="750" fill="#202B35" font-size="13" font-weight="800">Pick the word that fits what you want to make:</text>
    <rect x="113" y="766" width="115" height="34" fill="#F4F0E7" stroke="#202B35" stroke-width="2"/>
    <rect x="240" y="766" width="125" height="34" fill="#F4F0E7" stroke="#202B35" stroke-width="2"/>
    <rect x="377" y="766" width="144" height="34" fill="#F4F0E7" stroke="#202B35" stroke-width="2"/>
    <text x="170" y="789" text-anchor="middle" fill="#202B35" font-size="11" font-weight="900" letter-spacing="1.1">MAKE</text>
    <text x="302" y="789" text-anchor="middle" fill="#202B35" font-size="11" font-weight="900" letter-spacing="1.1">EXPLORE</text>
    <text x="449" y="789" text-anchor="middle" fill="#202B35" font-size="11" font-weight="900" letter-spacing="1.1">SHARE</text>
  </g>
  <!-- Product, printed as a bold question rather than a finished prescription -->
  <g filter="url(#shadow)" stroke="#202B35" stroke-linejoin="round">
    <path d="M821 235l78-44 76 31 79-31 87 52-47 111-48-24v352H834V330l-49 25-49-105 85-42z" fill="#FBF8F0" stroke-width="8"/>
    <path d="M899 191l76 31-31 75-77-60zM975 222l79-31 39 45-81 61z" fill="#E7E1D5" stroke-width="6"/>
    <path d="M785 355l-48-105 49-23 49 91zM1146 353l44-94 50 27-47 91z" fill="#D94732" stroke-width="7"/>
    <path d="M834 330l-49 25m361-25 53 28" fill="none" stroke-width="5"/>
    <path d="M867 373h216v178H867z" fill="#E5AC3D" stroke-width="5"/>
    <path d="M884 390h182v143H884z" fill="none" stroke="#287C78" stroke-width="3"/>
    <text x="975" y="486" text-anchor="middle" fill="#202B35" stroke="none" font-family="Georgia, serif" font-size="86" font-weight="700">?</text>
    <text x="975" y="520" text-anchor="middle" fill="#202B35" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900" letter-spacing="2">YOUR IDEA HERE</text>
    <path d="M899 570h152" stroke="#D94732" stroke-width="7"/>
    <text x="975" y="603" text-anchor="middle" fill="#202B35" stroke="none" font-family="Georgia, serif" font-size="17" font-style="italic">The First Mark Tee</text>
  </g>
  <!-- Choice leads toward the product; the next step remains optional -->
  <path d="M546 766 680 719 778 520" fill="none" stroke="#202B35" stroke-width="3" stroke-dasharray="7 8"/>
  <path d="M758 531l20-11-2 23" fill="none" stroke="#202B35" stroke-width="3"/>
  <rect x="94" y="840" width="279" height="0" fill="none"/>
  <text x="95" y="858" fill="#202B35" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing=".5">A word is a starting point. Change it, skip it, or just explore the tee.</text>
  <rect x="1120" y="759" width="250" height="66" fill="#202B35" stroke="#F4F0E7" stroke-width="3"/>
  <text x="1143" y="800" fill="#FFF9EF" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" letter-spacing="1.2">EXPLORE THE TEE</text>
  <path d="M1335 792h18m-8-8 8 8-8 8" fill="none" stroke="#FFF9EF" stroke-width="3"/>
  <text x="1368" y="856" text-anchor="end" fill="#FFF9EF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900" letter-spacing="1.7">MAKE ROOM FOR WHAT'S NEXT</text>
</svg>
