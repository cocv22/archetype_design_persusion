  </g>

  <rect y="804" width="1600" height="96" fill="#e64232" />
  <rect y="804" width="1600" height="2" fill="#17191d" />
  <g fill="#fffdf7" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing=".8">
    <text x="100" y="851">FICTIONAL CAMPAIGN</text>
    <text x="100" y="866">CONCEPT ONLY</text>
  </g>
  <g fill="#fffdf7" font-family="Archivo Black, Arial Black, sans-serif" font-size="30" font-weight="400">
