<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1685" viewBox="0 0 1600 1685" role="img" aria-labelledby="title description">
  <title id="title">ASCEND: Guessing's a Bad Fit — complete fit-check campaign</title>
  <desc id="description">The complete ASCEND Jester Hero-3 page: a full-width fit-check hero with a prominent blank white shirt in a Memphis-inspired illustration, a free three-step fit guide, and product details.</desc>
  <defs>
    <pattern id="paper-dots" width="17" height="17" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1c1b20" opacity=".14" />
    </pattern>
    <pattern id="checker" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#1c1b20" />
      <rect x="18" y="18" width="18" height="18" fill="#1c1b20" />
    </pattern>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#1c1b20" opacity=".55" />
    </pattern>
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="5" height="12" fill="#1c1b20" />
    </pattern>
  </defs>

  <rect width="1600" height="1685" fill="#f3eddf" />

  <rect width="1600" height="76" fill="#fffdf8" />
  <path d="M0 75h1600" stroke="#1c1b20" stroke-width="2" />
  <path d="M70 21a16 16 0 0 1 32 0v16a16 16 0 0 1-32 0z" fill="#c2df59" stroke="#1c1b20" stroke-width="2" transform="rotate(-8 86 37)" />
  <text x="86" y="43" text-anchor="middle" fill="#1c1b20" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="19" font-weight="600">A</text>
  <text x="112" y="42" fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing=".72">ASCEND</text>
  <g transform="rotate(1 1436 36.5)">
    <rect x="1347" y="23" width="184" height="33" fill="#1c1b20" />
    <rect x="1344" y="20" width="184" height="33" fill="#f06a76" stroke="#1c1b20" stroke-width="2" />
    <text x="1436" y="41" text-anchor="middle" fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing=".8">A LITTLE HELP. NO STRINGS.</text>
  </g>

  <rect y="76" width="1600" height="766" fill="#f3eddf" />
  <rect y="76" width="1600" height="766" fill="url(#paper-dots)" />

  <g transform="rotate(-2 157.5 277.5)">
    <rect x="75" y="257" width="171" height="33" fill="#5acbd0" stroke="#1c1b20" stroke-width="2" />
    <text x="85" y="278" fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing=".8">FREE FIT CHECK, NO FORM</text>
  </g>

  <g fill="#1c1b20" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="92" font-weight="700">
    <text x="72" y="382">GUESSING'S</text>
  </g>
  <g fill="#cf4159" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="92" font-weight="700">
    <text x="72" y="461">A BAD FIT.</text>
  </g>

  <g fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="500">
    <text x="72" y="510">Before we talk tees, here's a free fit check for a shirt you already</text>
    <text x="72" y="533">love. Two quick measurements, less wild guessing. The tape</text>
    <text x="72" y="555">measure does the math; you keep the drama.</text>
  </g>

  <rect x="77" y="579" width="220" height="51" fill="#f06a76" />
  <a href="#fit-guide" aria-label="Get the free fit check">
    <rect x="72" y="574" width="220" height="51" fill="#1c1b20" stroke="#1c1b20" stroke-width="2" />
    <text x="87" y="605" fill="#fffdf8" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="800">GET THE FREE FIT CHECK</text>
    <text x="273" y="605" text-anchor="middle" fill="#fffdf8" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="23" font-weight="600">&#8594;</text>
  </a>
  <text x="72" y="652" fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="700">No email. No purchase. Just a genuinely useful little tip.</text>

  <svg x="563" y="179" width="532" height="558" viewBox="0 0 620 650" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A blank white shirt surrounded by playful Memphis-inspired shapes">
    <path d="M107 61 222 40l25 40-24 38 31 39-28 41H98l-28-39 26-32-23-32Z" fill="#f06a76" stroke="#1c1b20" stroke-width="4" />
    <circle cx="455" cy="148" r="91" fill="#c2df59" stroke="#1c1b20" stroke-width="4" />
    <path d="M470 76h20v20h-20zm20 20h20v20h-20zm-20 20h20v20h-20zm20 20h20v20h-20z" fill="url(#checker)" />
    <path d="M451 469h117v88H451z" fill="#9b7ce0" stroke="#1c1b20" stroke-width="4" />
    <path d="M451 469h117v88H451z" fill="url(#stripes)" opacity=".7" />
    <path d="M54 396q39-39 78 0t78 0 78 0" fill="none" stroke="#5acbd0" stroke-width="18" stroke-linecap="round" />
    <path d="m493 277 29-38 28 38-28 39Z" fill="#f5cf55" stroke="#1c1b20" stroke-width="4" />
    <path d="M95 237h14v62H95zm22 17h14v62h-14zm22-17h14v62h-14z" fill="#9b7ce0" />
    <circle cx="91" cy="543" r="29" fill="#f5cf55" stroke="#1c1b20" stroke-width="4" />
    <path d="m77 543 14-15 14 15-14 15Z" fill="#1c1b20" />
    <path d="m552 380 18 18m0-18-18 18m-431 91 15 15m0-15-15 15" stroke="#1c1b20" stroke-width="6" stroke-linecap="round" />

    <g stroke="#1c1b20" stroke-linejoin="round" stroke-linecap="round">
      <path d="m231 177-81 41-46 103 72 31 28-57v244h220V295l28 57 72-31-46-103-81-41q-17 72-83 72t-83-72Z" fill="#fffdf8" stroke-width="9" />
      <path d="M231 177q17 71 83 72 66-1 83-72M204 295v244m220-244v244" fill="none" stroke-width="5" />
    </g>

    <g font-family="Arial, sans-serif" font-weight="800" fill="#1c1b20">
      <text x="44" y="344" font-size="13" letter-spacing="1.3" transform="rotate(-90 44 344)">ZERO GUESSWORK</text>
      <text x="443" y="590" font-size="13" letter-spacing="1.2">JUST THE TEE</text>
    </g>
    <path d="m312 115 10-19m20 22 17-15m17 22 18-10" stroke="#f06a76" stroke-width="7" stroke-linecap="round" />
  </svg>

  <g transform="rotate(1 1330.5 458)">
    <rect x="1132" y="364" width="397" height="188" fill="#9b7ce0" />
    <rect x="1132" y="364" width="397" height="188" fill="#c2df59" stroke="#1c1b20" stroke-width="3" />
    <circle cx="1486" cy="365" r="20" fill="#f5cf55" stroke="#1c1b20" stroke-width="3" />
    <text x="1156" y="401" fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing=".8">A LITTLE SOMETHING, FIRST</text>
    <text x="1156" y="430" fill="#1c1b20" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="25" font-weight="600">The 20-second fit check</text>
    <g fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="600">
      <text x="1155" y="460">Lay a tee you love flat. Measure straight across from</text>
      <text x="1155" y="478">pit seam to pit seam. That's your flat chest width—one</text>
      <text x="1155" y="496">useful number, no fitting-room monologue.</text>
    </g>
    <text x="1155" y="527" fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="800">Free to use. No signup needed.</text>
  </g>

  <rect y="842" width="1600" height="58" fill="#9b7ce0" />
  <rect y="840" width="1600" height="2" fill="#1c1b20" />
  <text x="72" y="878" fill="#1c1b20" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="17" font-weight="600">Useful first. Shirt second.</text>
  <text x="1528" y="876" text-anchor="end" fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing=".8">KEEP THE TIP EITHER WAY</text>

  <rect y="900" width="1600" height="681" fill="#5acbd0" />
  <circle cx="1590" cy="900" r="75" fill="#f06a76" stroke="#1c1b20" stroke-width="3" />
  <text x="128" y="991" fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1">THE FIT CHECK, PROPERLY EXPLAINED</text>
  <g fill="#1c1b20" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="58" font-weight="600">
    <text x="128" y="1051">Three small steps. A lot</text>
    <text x="128" y="1107">less shrugging.</text>
  </g>
  <g fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="14">
    <text x="128" y="1148">Use a shirt you already like as your reference. This little guide is yours whether or not you</text>
    <text x="128" y="1170">shop ASCEND.</text>
  </g>

  <path d="M128 1205h1344M128 1382h1344" stroke="#1c1b20" stroke-width="2" />
  <path d="M576 1207v173M1024 1207v173" stroke="#1c1b20" stroke-width="2" />

  <g font-family="Fredoka, Trebuchet MS, sans-serif" font-size="31" font-weight="600" fill="#ad334d">
    <text x="128" y="1257">01</text>
    <text x="598" y="1257">02</text>
    <text x="1046" y="1257">03</text>
  </g>
  <g fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="16" font-weight="700">
    <text x="128" y="1286">Pick your favorite</text>
    <text x="576" y="1286">Measure across</text>
    <text x="1024" y="1286">Compare like with like</text>
  </g>
  <g fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="13">
    <text x="128" y="1320">Choose a tee whose fit feels right. Lay it flat on</text>
    <text x="128" y="1340">a table and smooth it without stretching.</text>
    <text x="598" y="1320">Measure straight across the chest from one pit</text>
    <text x="598" y="1340">seam to the other. You can also note shoulder seam</text>
    <text x="598" y="1360">to shoulder seam.</text>
    <text x="1046" y="1320">When a garment chart is available, compare the same</text>
    <text x="1046" y="1340">laid-flat measurements. Cuts and size charts vary,</text>
    <text x="1046" y="1360">so check the listed method.</text>
  </g>

  <g fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="600">
    <text x="128" y="1415">This is a general measuring tip, not a claim about ASCEND shirt measurements or fit. No purchase, signup, email, or</text>
    <text x="128" y="1432">measurements shared with us are needed.</text>
  </g>

  <text x="128" y="1492" fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="700">There. A little less guessing, a little more getting on with your day.</text>
  <rect x="1241" y="1462" width="231" height="51" fill="#f06a76" />
  <rect x="1236" y="1457" width="231" height="51" fill="#1c1b20" stroke="#1c1b20" stroke-width="2" />
  <text x="1250" y="1488" fill="#fffdf8" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="800">NOW, MEET THE PLAIN TEE</text>
  <text x="1447" y="1488" text-anchor="middle" fill="#fffdf8" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="23" font-weight="600">&#8594;</text>

  <rect y="1581" width="1600" height="104" fill="#f3eddf" />
  <path d="M0 1581h1600" stroke="#1c1b20" stroke-width="2" />
  <text x="128" y="1650" fill="#1c1b20" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="25" font-weight="600">ASCEND. Your blank-canvas pal.</text>
  <g fill="#1c1b20" font-family="DM Sans, Arial, sans-serif" font-size="12">
    <text x="932" y="1638">A premium plain white shirt: a clean, versatile base for your style, your mood,</text>
    <text x="932" y="1657">and your next little adventure.</text>
  </g>
</svg>