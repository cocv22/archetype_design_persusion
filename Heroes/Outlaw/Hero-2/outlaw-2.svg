  <g transform="rotate(-2 1059 298)">
    <rect x="924" y="262" width="262" height="32" fill="#b52e27" />
    <rect x="928" y="259" width="262" height="32" fill="#b52e27" />
    <text x="938" y="280" fill="#fffdf8" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1">A NOTE FROM THE NONCONFORMITY DESK</text>
  </g>
  <g fill="#17191d" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="94">
    <text x="928" y="392">THE DRESS CODE</text>
  </g>
  <text x="928" y="483" fill="#b52e27" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="94">IS A SUGGESTION.</text>
  <g fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="15" font-weight="500">
    <text x="928" y="546">Meet the ASCEND premium plain white shirt: no memo on</text>
    <text x="928" y="570">who to be, no committee meeting about your outfit. Keep</text>
    <text x="928" y="594">the tee simple. Make the rest your call.</text>
  </g>

  <rect x="933" y="620" width="217" height="52" fill="#b52e27" />
  <a href="#rule" aria-label="Write your own rule">
    <rect x="928" y="615" width="217" height="52" fill="#17191d" stroke="#17191d" stroke-width="2" />
    <text x="947" y="647" fill="#fffdf8" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="800">WRITE YOUR OWN RULE</text>
    <text x="1120" y="647" text-anchor="middle" fill="#fffdf8" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="24">&#8594;</text>
  </a>
  <text x="928" y="693" fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="700">Optional, editable, and not a purchase promise.</text>

  <rect x="1398" y="764" width="109" height="83" fill="#eee4d3" stroke="#17191d" stroke-width="2" transform="rotate(5 1452.5 805.5)" />
  <g fill="#17191d" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="18" transform="rotate(5 1452.5 805.5)">
    <text x="1452.5" y="790" text-anchor="middle">KEEP</text>
    <text x="1452.5" y="807" text-anchor="middle">YOUR</text>
    <text x="1452.5" y="824" text-anchor="middle">OWN RULES</text>
  </g>

  <rect y="900" width="1600" height="412" fill="#17191d" />
  <rect y="900" width="1600" height="3" fill="#b52e27" />
  <text x="128" y="986" fill="#d9c5a7" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1">ONE SMALL DECLARATION. YOURS TO EDIT.</text>
  <g fill="#f2eadb" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="62">
    <text x="128" y="1045">WRITE THE RULE</text>
    <text x="128" y="1106">YOU WANT TO LIVE</text>
    <text x="128" y="1167">BY.</text>
  </g>
  <g fill="#fffdf8" font-family="DM Sans, Arial, sans-serif" font-size="13">
    <text x="128" y="1207">A personal style rule can be a useful reminder to</text>
    <text x="128" y="1228">dress on your own terms. Make it specific, keep it</text>
    <text x="128" y="1249">light, and change it when it stops feeling like you.</text>
  </g>

  <text x="793" y="986" fill="#eee4d3" font-family="DM Sans, Arial, sans-serif" font-size="13" font-weight="800">Today, my rule is...</text>
  <rect x="793" y="996" width="679" height="56" fill="#eee4d3" stroke="#eee4d3" stroke-width="2" />
  <text x="809" y="1030" fill="#5b574f" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="600">My style, my call.</text>

  <rect x="793" y="1065" width="114" height="45" fill="#71251f" stroke="#71251f" stroke-width="2" />
  <text x="850" y="1093" text-anchor="middle" fill="#fffdf8" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="800">Put it in writing</text>
  <rect x="917" y="1065" width="128" height="45" fill="none" stroke="#eee4d3" stroke-width="2" />
  <text x="981" y="1093" text-anchor="middle" fill="#eee4d3" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="800">Clear or change it</text>

  <text x="793" y="1141" fill="#eee4d3" font-family="DM Sans, Arial, sans-serif" font-size="11">Rather skip the prompt?</text>
  <text x="925" y="1141" fill="#fffdf8" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="800" text-decoration="underline">Meet the plain white tee.</text>
  <text x="793" y="1168" fill="#d9c5a7" font-family="DM Sans, Arial, sans-serif" font-size="10">Your words stay in this page only; nothing is saved or sent. This choice is not a purchase, signup, or marketing consent.</text>

