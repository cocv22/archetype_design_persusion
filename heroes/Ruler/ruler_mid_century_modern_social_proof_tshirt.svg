<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">A better everyday, together — Common Ground tee</title>
  <desc id="desc">A mid-century modern advertising hero for an everyday T-shirt. Warm colors, a curved product silhouette, clean typography, and neighbors wearing the tee create an approachable sense of shared choice.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#263A35" flood-opacity=".15"/></filter>
    <clipPath id="panel"><path d="M720 146H1360V764H720Z"/></clipPath>
  </defs>
  <rect width="1440" height="900" fill="#F3EEE2"/><rect x="0" y="0" width="1440" height="13" fill="#C65F43"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263B38">
    <text x="78" y="69" font-size="18" font-weight="700" letter-spacing="3.5">COMMON GROUND</text>
    <text x="1360" y="69" text-anchor="end" font-size="12" font-weight="700" letter-spacing="2">GOODS FOR EVERYDAY LIVING</text>
  </g>
  <circle cx="99" cy="113" r="5" fill="#C65F43"/><path d="M114 113h62" stroke="#C65F43" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263B38">
    <text x="78" y="220" font-size="63" font-weight="700" letter-spacing="-2.6">A BETTER</text>
    <text x="78" y="290" font-size="63" font-weight="700" letter-spacing="-2.6">EVERYDAY,</text>
    <text x="78" y="360" font-size="63" font-weight="700" letter-spacing="-2.6">TOGETHER.</text>
  </g>
  <path d="M80 396h77" stroke="#D09C43" stroke-width="5" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#53615A">
    <text x="78" y="455" font-size="19">The dependable tee for workdays, weekends</text>
    <text x="78" y="484" font-size="19">and everything in between.</text>
  </g>
  <text x="78" y="536" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#263B38">COMMON GROUND EVERYDAY TEE</text>
  <text x="78" y="561" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#53615A">A comfortable fit. Ready for the long haul.</text>
  <rect x="78" y="599" width="241" height="62" rx="31" fill="#263B38"/>
  <text x="105" y="637" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing=".7" fill="#F9F5EA">MEET YOUR NEW TEE</text>
  <path d="M286 630h15m-6-6 6 6-6 6" fill="none" stroke="#F9F5EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="713" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#53615A">SEE HOW IT LOOKS ON YOUR NEIGHBORS</text>
  <!-- Warm editorial portrait tokens signal the range of everyday wearers without invented ratings. -->
