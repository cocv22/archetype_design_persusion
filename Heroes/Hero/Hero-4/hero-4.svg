<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="988" viewBox="0 0 1600 988" role="img" aria-labelledby="title description">
  <title id="title">ASCEND: Rise together — complete Pop Art Unity advertisement</title>
  <desc id="description">A complete ASCEND advertisement for a premium plain white shirt. The yellow halftone hero features a cream masthead, motivational headline, supporting copy, call to action, and an original Pop Art illustration of people progressing together beside a prominent white shirt. A pink product strip completes the page.</desc>
