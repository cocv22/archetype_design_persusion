<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1122" role="img" aria-labelledby="title description">
  <title id="title">ASCEND | Become your next self</title>
  <desc id="description">ASCEND advertisement for a premium plain white shirt, featuring the message Become your own next, a finite first edition notice, and release information.</desc>
  <rect width="1600" height="1122" fill="#f4f1e8"/>

  <g fill="#171918">
    <path d="M0 93.5h1600" stroke="#171918" stroke-opacity=".22"/>
    <path d="M100 32h30v20l-10 10h-20z" fill="#d83424"/>
    <text x="115" y="51" fill="#f4f1e8" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="17" font-weight="700">A</text>
    <text x="141" y="52" font-family="'Archivo Black','Arial Black',sans-serif" font-size="24">ASCEND</text>
    <circle cx="1389" cy="47" r="4.5" fill="#28765e"/>
    <text x="1500" y="51" text-anchor="end" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">A CLEAR START. YOUR WAY.</text>
  </g>

  <g font-family="'Barlow Condensed','Arial Narrow',sans-serif" fill="#171918">
    <rect x="100" y="209" width="24" height="4" fill="#d83424"/>
    <text x="134" y="219" font-size="18" font-weight="700" letter-spacing="1.25">FOR WHO YOU'RE BECOMING</text>

    <text x="100" y="337" font-size="116" font-weight="800" letter-spacing="0">BECOME</text>
    <text x="100" y="433" fill="#d83424" font-size="116" font-weight="800" letter-spacing="0">YOUR OWN</text>
    <text x="100" y="529" font-size="116" font-weight="800" letter-spacing="0">NEXT.</text>
  </g>

  <g fill="#171918" font-family="'DM Sans','Helvetica Neue',sans-serif">
    <text x="100" y="579" font-size="17">A premium plain white shirt: a clean, versatile foundation</text>
    <text x="100" y="607" font-size="17">for expressing who you are and pursuing the goals you</text>
    <text x="100" y="635" font-size="17">choose.</text>
  </g>

  <g>
    <rect x="100" y="666" width="300" height="56" fill="#171918"/>
    <text x="124" y="700" fill="#f4f1e8" font-family="'DM Sans','Helvetica Neue',sans-serif" font-size="16" font-weight="700">Choose your next step</text>
    <text x="374" y="701" fill="#f4f1e8" text-anchor="end" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="25" font-weight="700">→</text>
    <text x="424" y="699" fill="#171918" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="17" font-weight="700" letter-spacing=".6">ASCEND PREMIUM PLAIN WHITE SHIRT</text>
  </g>

  <g>
    <path d="M100 758h420" stroke="#171918" stroke-opacity=".22"/>
    <rect x="100" y="772" width="5" height="60" fill="#f2ca43"/>
    <text x="119" y="789" fill="#171918" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="18" font-weight="800" letter-spacing="1">FIRST EDITION. FINITE RELEASE.</text>
    <text x="119" y="812" fill="#171918" font-family="'DM Sans','Helvetica Neue',sans-serif" font-size="12">Fictional campaign concept. Confirm a real quantity before release;</text>
    <text x="119" y="831" fill="#171918" font-family="'DM Sans','Helvetica Neue',sans-serif" font-size="12">no guessed stock.</text>
  </g>

