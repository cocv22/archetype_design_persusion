<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Make your mark — The First Mark Tee</title>
  <desc id="desc">A playful postmodern classicism advertising hero. A sculptural classical arch frames a question-mark T-shirt and an optional choice of creative intention. Visitors can choose a word, then explore the tee.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="15" stdDeviation="13" flood-color="#28233B" flood-opacity=".2"/>
    </filter>
    <pattern id="sunDots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#F7EEDC" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" fill="#F7EEDC"/>
  <rect x="0" y="0" width="1440" height="15" fill="#28233B"/>
  <!-- Familiar civic architecture, enlarged and repurposed as an exuberant product frame -->
  <path d="M783 235V175L1085 74 1388 175v60z" fill="#E5A63A" stroke="#28233B" stroke-width="7" stroke-linejoin="round"/>
  <path d="M822 168 1085 86l263 82" fill="none" stroke="#F7EEDC" stroke-width="5"/>
  <path d="M780 236h611v29H780z" fill="#D85746" stroke="#28233B" stroke-width="6"/>
  <path d="M798 265h40v402h-40zM916 265h40v402h-40zM1215 265h40v402h-40zM1333 265h40v402h-40z" fill="#80A69B" stroke="#28233B" stroke-width="6"/>
  <path d="M781 660h178v31H781zM1198 660h178v31h-178z" fill="#D85746" stroke="#28233B" stroke-width="6"/>
  <path d="M968 241v449M1186 241v449" stroke="#28233B" stroke-width="2" stroke-dasharray="8 11" opacity=".27"/>
  <path d="M827 107h516v92H827z" fill="url(#sunDots)"/>
  <circle cx="1338" cy="313" r="34" fill="#D85746" stroke="#28233B" stroke-width="5"/>
  <path d="M1324 313h28m-14-14v28" stroke="#F7EEDC" stroke-width="4"/>
  <path d="M777 715h620" stroke="#28233B" stroke-width="6"/>
  <path d="M805 734h563" stroke="#E5A63A" stroke-width="11"/>
  <!-- Topline -->
  <text x="82" y="76" fill="#28233B" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="900" letter-spacing="4">COMMON THREAD</text>
  <text x="1359" y="76" text-anchor="end" fill="#28233B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="2">THE IDEA SERIES  /  01</text>
  <!-- Invitation -->
  <text x="85" y="176" fill="#D85746" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900" letter-spacing="2.7">A TEE FOR WHAT'S TAKING SHAPE</text>
  <text x="78" y="275" fill="#28233B" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-3">MAKE</text>
  <text x="78" y="358" fill="#28233B" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-3">YOUR</text>
  <text x="78" y="441" fill="#D85746" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" font-style="italic" letter-spacing="-4">mark.</text>
  <path d="M85 466h108" stroke="#E5A63A" stroke-width="9"/>
  <text x="86" y="512" fill="#28233B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Every good thing starts somewhere.</text>
  <text x="86" y="541" fill="#28233B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Wear the question. Make the answer yours.</text>
  <!-- Small, voluntary declaration: user selects a word that is easy to revise or skip -->
  <text x="87" y="599" fill="#28233B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900" letter-spacing="2">WHAT'S YOUR NEXT MOVE?  /  OPTIONAL</text>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="12" letter-spacing="1">
    <rect x="86" y="618" width="112" height="43" rx="2" fill="#F7EEDC" stroke="#28233B" stroke-width="2.5"/><text x="142" y="645" text-anchor="middle" fill="#28233B">MAKE</text>
    <rect x="210" y="618" width="128" height="43" rx="2" fill="#E5A63A" stroke="#28233B" stroke-width="2.5"/><text x="274" y="645" text-anchor="middle" fill="#28233B">EXPLORE</text>
    <rect x="350" y="618" width="112" height="43" rx="2" fill="#F7EEDC" stroke="#28233B" stroke-width="2.5"/><text x="406" y="645" text-anchor="middle" fill="#28233B">SHARE</text>
  </g>
  <text x="87" y="691" fill="#625D69" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Pick a word, change it, or skip straight to the tee.</text>
  <!-- Product as graphic artifact: wearable prompt, not a prescription -->
  <g filter="url(#shadow)" stroke="#28233B" stroke-linejoin="round">
    <path d="m1025 277 74-40 61 25 62-25 78 48 46 105-68 34-31-60v273H987V364l-33 60-67-34 48-105 90-8z" fill="#FBF8EF" stroke-width="8"/>
    <path d="m1099 237 61 25-30 68-67-45zM1160 262l62-25 39 32-72 61z" fill="#E3DBCA" stroke-width="6"/>
    <path d="m1025 277 38 17 41 8 29-7m27 0 29 7 41-8 34-17" fill="none" stroke-width="4"/>
    <path d="m935 318-48 72 67 34 40-69m306-78 46 24 46 105-68 34-35-69" fill="#D85746" stroke-width="7"/>
    <path d="M1007 378h269v201h-269z" fill="#E5A63A" stroke-width="5"/>
    <path d="M1024 395h235v166h-235z" fill="none" stroke="#80A69B" stroke-width="4"/>
    <text x="1141" y="505" text-anchor="middle" fill="#28233B" stroke="none" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="700">?</text>
    <text x="1141" y="545" text-anchor="middle" fill="#28233B" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="900" letter-spacing="2">YOUR IDEA HERE</text>
    <text x="1141" y="620" text-anchor="middle" fill="#28233B" stroke="none" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">The First Mark Tee</text>
  </g>
  <path d="M508 640c114 44 205 40 311-23" fill="none" stroke="#28233B" stroke-width="3" stroke-dasharray="7 9"/>
  <path d="m809 606 11 10-17 2" fill="none" stroke="#28233B" stroke-width="3"/>
  <!-- Clear next step; choosing a word never implies purchase -->
  <rect x="1010" y="766" width="335" height="70" rx="2" fill="#28233B"/>
  <path d="M1010 766h335v7h-335z" fill="#D85746"/>
  <text x="1040" y="810" fill="#F7EEDC" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" letter-spacing="1.2">EXPLORE THE FIRST MARK TEE</text>
  <path d="M1300 801h20m-9-9 9 9-9 9" fill="none" stroke="#F7EEDC" stroke-width="3"/>
  <text x="1345" y="864" text-anchor="end" fill="#28233B" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">SOFT COTTON  /  ROOM FOR WHAT'S NEXT</text>
  <path d="M0 878h1440v22H0z" fill="#28233B"/>
  <path d="M0 878h479" stroke="#D85746" stroke-width="7"/>
</svg>
