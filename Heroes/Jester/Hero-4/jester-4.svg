  <path d="M80 20 111 18l2 28-29 2Z" fill="#e94d56" stroke="#17191d" stroke-width="2" />
  <text x="96" y="40" text-anchor="middle" fill="#fffdf7" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="15" font-weight="700">A</text>
  <text x="118" y="41" fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing=".76">ASCEND</text>
  <text x="1520" y="42" text-anchor="end" fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1">TODAY'S DRESS CODE: YOURSELF</text>

  <svg x="0" y="74" width="1600" height="826" viewBox="0 0 1600 826" preserveAspectRatio="xMidYMid meet" aria-label="Expressive painted character wearing a blank white ASCEND shirt">
