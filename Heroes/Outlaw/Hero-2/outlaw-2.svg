<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1457" viewBox="0 0 1600 1457" role="img" aria-labelledby="title description">
  <title id="title">ASCEND: The Dress Code Is a Suggestion — complete Outlaw advertisement</title>
  <desc id="description">The complete ASCEND Outlaw page: a premium plain white shirt in a reimagined classical arch, direct headline and CTA, an optional empty style-rule form, and product details.</desc>
