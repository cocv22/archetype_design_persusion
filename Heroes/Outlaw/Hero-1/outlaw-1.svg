  <g transform="rotate(-2 223.5 199)">
    <rect x="95" y="173" width="255" height="32" fill="#d9c5a7" />
    <text x="106" y="194" fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1">THE USUAL RULES CAN SIT THIS ONE OUT</text>
  </g>
  <g fill="#f2eadb" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="91.2" font-weight="400">
    <text x="96" y="304">NO UNIFORM.</text>
  </g>
  <text x="96" y="387" fill="#e7614e" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="91.2">NO PERMISSION.</text>
  <g fill="#fffdf8" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="500">
    <text x="96" y="432">ASCEND's premium plain white shirt: no script, no logo,</text>
    <text x="96" y="454">no committee meeting about your outfit. Keep the tee</text>
    <text x="96" y="476">simple. Make the rest your call.</text>
  </g>
  <rect x="101" y="506" width="238" height="52" fill="#bd372e" />
  <a href="#field-guide" aria-label="Get the free field notes">
    <rect x="96" y="501" width="238" height="52" fill="#f2eadb" stroke="#f2eadb" stroke-width="2" />
    <text x="115" y="533" fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="800">GET THE FREE FIELD NOTES</text>
    <text x="312" y="534" text-anchor="middle" fill="#17191d" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="25">&#8594;</text>
  </a>
  <text x="96" y="577" fill="#d9c5a7" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="700">Three practical style prompts. No signup or purchase.</text>
  <text x="96" y="607" fill="#fffdf8" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="700" text-decoration="underline">Skip the notes and see the plain tee.</text>

  <g transform="rotate(5 1452 805.5)">
    <rect x="1398" y="764" width="109" height="83" fill="#f2eadb" stroke="#17191d" stroke-width="2" />
    <g fill="#17191d" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="18">
      <text x="1452.5" y="790" text-anchor="middle">KEEP</text>
      <text x="1452.5" y="807" text-anchor="middle">YOUR</text>
      <text x="1452.5" y="824" text-anchor="middle">OWN RULES</text>
    </g>
  </g>

  <rect y="900" width="1600" height="616" fill="#f2eadb" />
  <rect y="900" width="1600" height="3" fill="#17191d" />
  <text x="128" y="991" fill="#bd372e" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1">FREE FIELD NOTES / NO PURCHASE REQUIRED</text>
  <g fill="#17191d" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="64">
    <text x="128" y="1052">THREE WAYS TO UNLEARN THE</text>
    <text x="128" y="1113">UNIFORM.</text>
  </g>
  <g fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="14">
    <text x="128" y="1158">A tiny style guide for making a plain tee feel like your choice, not somebody else's dress code.</text>
    <text x="128" y="1180">Take the ideas; leave the rest.</text>
  </g>

  <path d="M128 1214h1344M128 1375h1344" stroke="#17191d" stroke-width="2" />
  <path d="M576 1216v157M1024 1216v157" stroke="#17191d" stroke-width="2" />
  <g fill="#bd372e" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="35">
    <text x="128" y="1264">01</text>
    <text x="598" y="1264">02</text>
    <text x="1046" y="1264">03</text>
  </g>
  <g fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="16" font-weight="800">
    <text x="128" y="1295">Change the silhouette</text>
    <text x="598" y="1295">Break one expectation</text>
    <text x="1046" y="1295">Retire the approval check</text>
  </g>
  <g fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="13">
    <text x="128" y="1328">Try it tucked, untucked, or with one sleeve casually</text>
    <text x="128" y="1348">rolled. Keep the version that feels like you.</text>
    <text x="600" y="1328">Pick one detail you usually avoid and test it with</text>
    <text x="600" y="1348">what you already own. One switch can change the</text>
    <text x="600" y="1368">whole mood.</text>
    <text x="1048" y="1328">Ask whether you feel good in it, not whether it</text>
    <text x="1048" y="1348">follows an invisible rule. That's the whole test.</text>
  </g>

  <text x="128" y="1418" fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="600">Keep these notes whether or not you buy anything. No email gate, no hidden ask.</text>
  <text x="128" y="1452" fill="#17191d" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="600">Now, meet the plain tee</text>
